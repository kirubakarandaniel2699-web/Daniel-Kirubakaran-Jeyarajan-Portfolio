<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Project Case Study</title>

    <style>
        /* RESET */
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: #f8fafc;
            color: #111827;
        }

        /* 🔥 HERO SECTION */
        .hero-image {
            position: relative;
            width: 100%;
            height: 420px;
            overflow: hidden;
        }

        .hero-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .hero-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.2));
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 2rem;
            color: white;
        }

        .hero-overlay h1 {
            font-size: 2.5rem;
            margin: 0;
        }

        .hero-sub {
            font-size: 1rem;
            opacity: 0.9;
        }

        /* MAIN CONTAINER */
        .project-details-container {
            max-width: 1100px;
            margin: 3rem auto;
            background: white;
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.06);
        }

        /* GRID */
        .project-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
        }

        /* LEFT */
        .project-left h2 {
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        .project-left p {
            color: #6b7280;
            line-height: 1.6;
        }

        /* META */
        .project-meta {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin: 2rem 0;
        }

        .meta-item h4 {
            font-size: 0.8rem;
            color: #6b7280;
        }

        .meta-item p {
            font-weight: 500;
        }

        /* BUTTONS */
        .project-buttons {
            display: flex;
            gap: 1rem;
        }

        .btn {
            padding: 0.7rem 1.4rem;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .btn-primary {
            background: #1e3a8a;
            color: white;
            transition: 0.3s;
        }

        .btn-primary:hover {
            background: #3b82f6;
        }

        .btn-outline {
            border: 1px solid #1e3a8a;
            color: #1e3a8a;
        }

        .btn-outline:hover {
            background: #1e3a8a;
            color: white;
        }

        /* RIGHT */
        .project-right h3 {
            margin-top: 1.5rem;
            color: #1e3a8a;
        }

        .project-right p {
            color: #6b7280;
            line-height: 1.6;
        }

        /* LIST */
        #featuresList,
        #processList {
            padding-left: 1rem;
        }

        #featuresList li,
        #processList li {
            margin-bottom: 0.5rem;
        }

        /* TAGS */
        .tech-tag {
            display: inline-block;
            background: #eef2ff;
            color: #1e3a8a;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            margin: 0.3rem;
            font-size: 0.8rem;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {

            .hero-image {
                height: 260px;
            }

            .hero-overlay h1 {
                font-size: 1.6rem;
            }

            .project-content {
                grid-template-columns: 1fr;
            }

            .project-meta {
                grid-template-columns: 1fr;
            }

            .project-buttons {
                flex-direction: column;
            }

        }
    </style>
</head>

<body>

    <!-- 🔥 HERO -->
    <section class="project-hero">
        <div class="hero-image">
            <img id="mainImage" src="" alt="Project">
            <div class="hero-overlay">
                <h1 id="heroTitle">Project Title</h1>
                <p class="hero-sub">UI/UX Case Study</p>
            </div>
        </div>
    </section>

    <!-- CONTENT -->
    <section class="project-details-container">

        <div class="project-content">

            <!-- LEFT -->
            <div class="project-left">
                <h2 id="projectTitle"></h2>
                <p id="projectDescription"></p>

                <div class="project-meta">
                    <div class="meta-item">
                        <h4>Category</h4>
                        <p id="projectCategory"></p>
                    </div>
                    <div class="meta-item">
                        <h4>Year</h4>
                        <p id="projectYear"></p>
                    </div>
                    <div class="meta-item">
                        <h4>Services</h4>
                        <p id="projectServices"></p>
                    </div>
                </div>

                <div class="project-buttons">
                    <a id="projectLink" class="btn btn-primary" target="_blank">Visit Project</a>
                    <a href="index.html" class="btn btn-outline">Back</a>
                </div>
            </div>

            <!-- RIGHT -->
            <div class="project-right">

                <h3>Project Overview</h3>
                <p id="projectOverview"></p>

                <h3>Problem</h3>
                <p id="projectProblem"></p>

                <h3>Solution</h3>
                <p id="projectSolution"></p>

                <h3>Design Process</h3>
                <ul id="processList"></ul>

                <h3>Key Features</h3>
                <ul id="featuresList"></ul>

                <h3>Technologies Used</h3>
                <div id="techTags"></div>

            </div>

        </div>

    </section>

    <script src="project-details.js"></script>

</body>

</html>
